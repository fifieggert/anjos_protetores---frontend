# Configuração da análise no SonarCloud (usada pelo job "sonar" do .github/workflows/ci.yml).
# A análise automática do SonarCloud deve ficar desligada no painel: quem analisa é o CI.
sonar.organization=fifieggert
sonar.projectKey=fifieggert_anjos_protetores---frontend
sonar.projectName=Anjos Protetores - Frontend

# Código analisado
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Fora da análise:
# - testes (quando existirem) e arquivos de tipos (.d.ts, gerados/declarações);
# - dadosAbrigo.ts: dados de contato do abrigo, com TODOs de preenchimento que o Sonar
#   apontaria como pendências (a lógica dele é pequena: montar o link do WhatsApp).
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**,src/**/*.d.ts,src/pages/Publico/dadosAbrigo.ts

# Cobertura de testes: ainda não há testes no frontend. Quando houver (ex.: Vitest com
# "--coverage" gerando coverage/lcov.info), descomente as linhas abaixo e baixe o
# relatório no job do Sonar, como no backend.
# sonar.tests=src
# sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
