# CI do frontend: qualidade (lint + build com checagem de tipos), teste da imagem Docker
# (sem push) e análise no SonarCloud (só quando o segredo SONAR_TOKEN existir).
# A publicação no ECR é o deploy.yml. Detalhes em docs/deploy-frontend.md.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Permissão mínima: só ler o código.
permissions:
  contents: read

# Um novo push na mesma branch/PR cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (lint e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node (versão do .nvmrc, a mesma do Dockerfile)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # "tsc -b" (tipos) + "vite build". Ainda não há scripts de teste nem de typecheck
      # separados; quando houver, entram aqui.
      - name: Build (inclui checagem de tipos)
        run: npm run build
        env:
          VITE_API_URL: /api

  docker:
    name: Imagem Docker (build e testes, sem push)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: anjos-protetores-frontend:ci
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar a imagem (rotas, fallback da SPA, headers, usuário)
        run: |
          set -euo pipefail
          URL=http://127.0.0.1:8080
          docker run -d --name web-ci -p 8080:8080 anjos-protetores-frontend:ci

          # espera o /health (até 30 s)
          for _ in $(seq 1 30); do
            curl -fs "$URL/health" > /dev/null && break
            sleep 1
          done

          falha() { echo "::error::$*"; exit 1; }
          status() { curl -s -o /dev/null -w '%{http_code}' "$URL$1"; }
          # header (minúsculo) de uma resposta, sem o \r do final
          header() { curl -s -D - -o /dev/null "$URL$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true; }

          # rotas
          [ "$(status /)" = 200 ] || falha "/ não retornou 200"
          [ "$(status /health)" = 200 ] || falha "/health não retornou 200"
          [ "$(curl -s "$URL/health")" = "ok" ] || falha "/health não respondeu ok"

          # fallback da SPA: rota inventada devolve o mesmo index.html (200)
          [ "$(status /animais/xyz)" = 200 ] || falha "/animais/xyz não retornou 200"
          INDEX=$(curl -s "$URL/")
          [ "$(curl -s "$URL/animais/xyz")" = "$INDEX" ] || falha "/animais/xyz não devolveu o index.html"
          [[ $INDEX == *'<div id="root">'* ]] || falha "index.html sem a div root"

          # arquivo inexistente em /assets/ é 404 (não pode virar index.html)
          [ "$(status /assets/nao-existe.js)" = 404 ] || falha "/assets/nao-existe.js deveria dar 404"

          # cache: index.html sempre revalida; assets com hash por 1 ano
          ASSET=$(grep -o '/assets/[^"]*\.js' <<< "$INDEX" | head -n 1 || true)
          [ -n "$ASSET" ] || falha "nenhum JS em /assets/ no index.html"
          [ "$(header / cache-control)" = "no-cache" ] || falha "index.html deveria ter Cache-Control no-cache"
          [[ $(header "$ASSET" cache-control) == *immutable* ]] || falha "$ASSET sem cache immutable"

          # gzip
          COMPRESSAO=$(curl -s -H 'Accept-Encoding: gzip' -D - -o /dev/null "$URL$ASSET" | tr -d '\r' | grep -i '^content-encoding:' || true)
          [[ ${COMPRESSAO,,} == *gzip* ]] || falha "$ASSET não veio com gzip"

          # headers de segurança (em página, rota da SPA e asset)
          for caminho in / /animais/xyz "$ASSET"; do
            [ "$(header "$caminho" x-content-type-options)" = "nosniff" ] || falha "$caminho sem X-Content-Type-Options"
            [ "$(header "$caminho" x-frame-options)" = "DENY" ] || falha "$caminho sem X-Frame-Options"
            [ -n "$(header "$caminho" referrer-policy)" ] || falha "$caminho sem Referrer-Policy"
            [ -n "$(header "$caminho" permissions-policy)" ] || falha "$caminho sem Permissions-Policy"
            [[ $(header "$caminho" content-security-policy) == *"frame-ancestors 'none'"* ]] || falha "$caminho sem frame-ancestors"
          done
          # sem versão do nginx e sem HSTS (o HTTPS é do Caddy)
          [ "$(header / server)" = "nginx" ] || falha "header Server mostra a versão: $(header / server)"
          [ -z "$(header / strict-transport-security)" ] || falha "HSTS não deveria vir do container"

          # roda sem root
          UID_PROCESSO=$(docker exec web-ci id -u)
          [ "$UID_PROCESSO" != "0" ] || falha "o container roda como root"
          echo "Tudo certo. Usuário do container: $(docker exec web-ci id -un) (UID $UID_PROCESSO)"

      - name: Logs do container
        if: ${{ always() }}
        run: docker logs web-ci || true

  sonar:
    name: SonarCloud
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Vazio enquanto o segredo não for criado no repositório: os passos são pulados.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Aviso (SONAR_TOKEN não configurado)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud pulada."

      - name: Checkout (histórico completo)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Análise SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
