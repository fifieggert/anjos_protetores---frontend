# Site do frontend dentro do container (substitui /etc/nginx/conf.d/default.conf).
# Só HTTP na porta 8080: o HTTPS é feito pelo Caddy, na frente, no servidor.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não mostra a versão do nginx nos headers e nas páginas de erro.
    server_tokens off;

    # Redirecionamentos com caminho relativo (sem "http://...:8080"), porque o visitante
    # acessa por https://abrigoanjosprotetores.com.br, não pela porta do container.
    absolute_redirect off;

    # Compressão gzip dos arquivos de texto (JS, CSS, SVG, JSON). Fontes woff2 e imagens
    # já são comprimidas e ficam de fora.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Saúde do container (HEALTHCHECK do Docker e testes do CI). Sem log, para as
    # verificações periódicas não encherem o log de acesso.
    location = /health {
        access_log off;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos gerados pelo Vite em /assets/ têm um hash no nome (ex.: index-a1b2c3.js).
    # Quando o conteúdo muda, o nome muda; então o navegador pode guardar por 1 ano sem
    # nunca perguntar de novo ("immutable").
    # Arquivo inexistente aqui dá 404 (e não o index.html), para o navegador não guardar
    # HTML no lugar de um JS.
    location /assets/ {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html nunca fica guardado sem conferir: depois de um deploy, o visitante recebe
    # na hora a versão nova (que aponta para os novos arquivos de /assets/).
    location = /index.html {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback de SPA: o React Router cuida das rotas no navegador. Um endereço como
    # /animais/123 não existe como arquivo, então o nginx entrega o index.html e o React
    # mostra a página certa. Outros arquivos da pasta public/ (ex.: favicon.svg) são
    # servidos normalmente, conferindo se mudaram a cada acesso.
    location / {
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
