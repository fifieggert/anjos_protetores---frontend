# Headers de segurança enviados em todas as respostas do site.
# Ficam neste arquivo separado porque, no nginx, um "add_header" dentro de um "location"
# apaga os herdados do "server". Cada location do default.conf inclui este arquivo.
# "always" = também nas respostas de erro (404, 500...).
#
# HSTS (forçar HTTPS) NÃO fica aqui: quem cuida do HTTPS é o Caddy, na frente.

# O navegador não "adivinha" o tipo do arquivo (ex.: tratar um texto como script).
add_header X-Content-Type-Options "nosniff" always;

# Ao clicar num link para outro site, envia só o domínio, nunca o caminho completo.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Proíbe exibir o site dentro de um <iframe> de outro site (clickjacking).
# X-Frame-Options para navegadores antigos; frame-ancestors (CSP) para os atuais.
add_header X-Frame-Options "DENY" always;

# CSP mínima e compatível com o Ant Design: NÃO restringe scripts, estilos nem imagens
# (o Ant Design usa estilos inline e as fotos dos animais vêm de links externos).
# Só bloqueia: ser exibido em iframe, plugins (<object>/<embed>), troca do endereço base
# dos links (<base>) e envio de formulários para outros domínios.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# Desliga recursos do navegador que o sistema não usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
